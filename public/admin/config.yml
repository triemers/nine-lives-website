backend:
  name: github
  repo: triemers/nine-lives-website
  branch: master
  base_url: https://REPLACE_WITH_SITE_URL
  auth_endpoint: auth

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Nine Lives" }
      - { label: "Tags (post type, e.g. Race Recap, Gear, Clinic)", name: "tags", widget: "list", required: false }
      - label: "Disciplines"
        name: "disciplines"
        widget: "select"
        multiple: true
        required: false
        options: ["Cyclocross", "XC MTB", "Gravel", "Bikepacking"]
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false, hint: "Optional. Leave blank to auto-generate from the first paragraph of the body." }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Cover Image Position", name: "coverPosition", widget: "string", required: false, hint: "CSS object-position, e.g. 'center 20%'. Defaults to centered." }
      - { label: "Body", name: "body", widget: "markdown" }
